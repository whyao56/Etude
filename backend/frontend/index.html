  const languages = catalogList("languages");
  const langSel = el("select", {
    id: "plan-language",
    onChange: (e) => { draft.language = e.target.value; render(); },
  });
  for (const lang of languages) {
    const opt = el("option", {
      value: lang.id,
      text: lang.label + "（" + lang.native + "）" + (lang.supported ? "" : " · 还没开放"),
      disabled: !lang.supported,
    });
    if (lang.id === draft.language) opt.selected = true;
    langSel.appendChild(opt);
  }
  card.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: "语言" }), langSel,
  ]));
  const profile = languages.find((l) => l.id === draft.language);
  if (profile && !profile.supported) {
    card.appendChild(el("div", { class: "hint", text: profile.note }));
  }

  const kinds = catalogList("goal_kinds");
  const seg = el("div", { class: "seg" });
  for (const kind of kinds) {
    seg.appendChild(el("button", {
      "aria-pressed": String(kind.id === draft.goalKind),
      onClick: () => { draft.goalKind = kind.id; render(); },
      text: kind.label,
    }));
  }
  card.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: "你想拿这门语言做什么" }), seg,
  ]));
  const kindInfo = kinds.find((k) => k.id === draft.goalKind);
  if (kindInfo) card.appendChild(el("div", { class: "hint", text: kindInfo.what }));

  if (draft.goalKind === "exam") {
    const exams = catalogList("exam_presets");
    const examSel = el("select", {
      id: "plan-exam",
      onChange: (e) => { draft.exam = e.target.value; render(); },
    });
    for (const item of exams) {
      const opt = el("option", { value: item.id, text: item.label + "（参考 " + item.band + "）" });
      if (item.id === draft.exam) opt.selected = true;
      examSel.appendChild(opt);
    }
    card.appendChild(el("label", { class: "field" }, [
      el("span", { class: "lab", text: "哪一场考试" }), examSel,
    ]));
    const picked = exams.find((e) => e.id === draft.exam);
    if (picked) {
      card.appendChild(el("div", {
        class: "hint",
        text: picked.detail + "　考试的等级只用来收窄范围，大纲仍然是按「句子和情境」排的，不会变成一张词表。",
      }));
    }
  }

  const detailLabel = draft.goalKind === "exam"
    ? "补充说明（可选）：你的弱项、时间安排、特别想攻的场景"
    : "具体一点：你打算用它做什么？";
  const detailHint = draft.goalKind === "exam"
    ? "例如：听力总是跟不上，想重点练反应速度"
    : "例如：明年去澳洲打工度假，要能跟房东和同事日常对话";
  const ta = el("textarea", {
    id: "plan-detail", placeholder: detailHint,
    onInput: (e) => { draft.detail = e.target.value; },
  });
  ta.value = draft.detail;
  card.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: detailLabel }), ta,
  ]));

  const domains = catalogList("domain_presets");
  const chips = el("div", { class: "chips" });
  for (const d of domains) {
    chips.appendChild(el("button", {
      class: "toggle", "aria-pressed": String(draft.domains.indexOf(d.id) >= 0),
      onClick: () => toggleDomain(d.id),
      text: d.label,
    }));
  }
  card.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: "要覆盖哪些场景（可多选，不选就按日常优先自己排）" }), chips,
  ]));

  const countSeg = el("div", { class: "seg" });
  for (const n of [1, 10, 20, 50]) {
    countSeg.appendChild(el("button", {
      "aria-pressed": String(!draft.customCount && draft.count === n),
      onClick: () => { draft.customCount = false; draft.count = n; render(); },
      text: n + " 个",
    }));
  }
  countSeg.appendChild(el("button", {
    "aria-pressed": String(draft.customCount),
    onClick: () => { draft.customCount = true; render(); },
    text: "自定义",
  }));
  card.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: "先储备多少个" }), countSeg,
  ]));

  if (draft.customCount) {
    card.appendChild(el("label", { class: "field" }, [
      el("span", { class: "lab", text: "自定义数量（1–200）" }),
      el("input", {
        type: "number", id: "plan-count", min: "1", max: "200", value: draft.count,
        onInput: (e) => {
          draft.count = Math.max(1, Math.min(200, Number(e.target.value) || 1));
        },
      }),
    ]));
  }

  card.appendChild(el("div", {
    class: "faint",
    text: "每个包 8 条例句 + 语音 + 场景图，所以 " + draft.count + " 个包大约要 "
        + Math.max(1, Math.round(draft.count * 0.6)) + "–"
        + Math.max(2, Math.round(draft.count * 1.5)) + " 分钟，并且会一直占着网络。",
  }));

  card.appendChild(el("div", { class: "row", style: "margin-top:12px" }, [
    btn("生成大纲", { class: "btn primary", id: "plan-create", onClick: createPlan }, "wand"),
    el("span", { class: "faint", text: "先生成大纲给你过目，确认了才开工。" }),
  ]));
  card.appendChild(el("div", { id: "plan-msg" }));
  return card;
}

function toggleDomain(id) {
  const i = draft.domains.indexOf(id);
  if (i >= 0) draft.domains.splice(i, 1);
  else draft.domains.push(id);
  render();
}

async function createPlan() {
  const msg = $("#plan-msg");
  if (!msg) return;
  clear(msg);
  const node = $("#plan-create");
  if (node) node.disabled = true;
  msg.appendChild(spin("正在让模型排大纲…"));

  const exams = catalogList("exam_presets");
  const exam = exams.find((e) => e.id === draft.exam);
  const payload = {
    language: draft.language,
    goal_kind: draft.goalKind,
    goal_label: draft.goalKind === "exam" ? (exam ? exam.label : "") : "",
    goal_detail: draft.goalKind === "exam"
      ? ((exam ? exam.band + " · " + exam.detail : "") + (draft.detail ? "　学习者补充：" + draft.detail : ""))
      : draft.detail,
    domains: draft.domains,
    target_count: draft.count,
  };
  if (draft.goalKind === "custom") payload.goal_label = draft.detail;

  try {
    const data = await api("/api/plans", { method: "POST", body: JSON.stringify(payload) });
    state.openPlan = data.plan;
    setBanner("ok", data.note ? "大纲排好了：" + data.note : "大纲排好了，往下过一遍，不要的条目点掉。");
    render();
  } catch (err) {
    clear(msg);
    msg.appendChild(errorBlock(err));
  } finally {
    if (node) node.disabled = false;
  }
}

async function loadPlans() {
  const host = $("#plan-list");
  if (!host) return;
  try {
    const data = await api("/api/plans");
    state.plans = data.plans || [];
    const navCount = $("#nav-plans");
    if (navCount) navCount.textContent = state.plans.length ? String(state.plans.length) : "";
    if (state.openPlan) return;
    clear(host);
    if (!state.plans.length) {
      host.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "art" }, [icon("plans", 40)]),
        el("b", { text: "还没有学习计划" }),
        el("div", { class: "faint", text: "上面填一次目标，就能批量储备一批素材，慢慢练。" }),
      ]));
      return;
    }
    for (const plan of state.plans) host.appendChild(planRow(plan));
  } catch (err) {
    clear(host);
    host.appendChild(errorBlock(err));
  }
}

function goalText(plan) {
  if (plan.goal_kind === "exam") return "准备 " + (plan.goal_label || "考试");
  if (plan.goal_kind === "custom") return plan.goal_label || plan.goal_detail || "自定义目标";
  return "真正学会这门语言";
}

function planRow(plan) {
  const box = el("div", { class: "plan" });
  const head = el("div", { class: "head" });
  const left = el("div", { class: "grow" });
  left.appendChild(el("div", { class: "title", text: goalText(plan) }));
  let subText = (plan.language || "en") + " · 目标 " + plan.target_count + " 个 · " + humanTime(plan.created_at);
  if (plan.domains && plan.domains.length) subText += " · " + plan.domains.join(" / ");
  left.appendChild(el("div", { class: "sub", text: subText }));
  head.appendChild(left);

  const acts = el("div", { class: "row" });
  acts.appendChild(btn("打开", { class: "btn sm", onClick: () => openPlan(plan.id) }, "book"));
  acts.appendChild(btn("删除", {
    class: "btn sm ghost danger",
    onClick: () => removePlan(plan.id, goalText(plan)),
  }, "trash"));
  head.appendChild(acts);
  box.appendChild(head);

  const p = plan.progress || {};
  const total = p.total || 0;
  const ready = p.ready || 0;
  const chips = el("div", { class: "chips", style: "margin-top:10px" });
  if (plan.status === "draft") chips.appendChild(el("span", { class: "chip accent", text: "大纲待确认" }));
  else if (plan.status === "generating") chips.appendChild(el("span", { class: "chip warn" }, [el("i", { class: "spin" }), " 正在生成"]));
  else if (plan.status === "failed") chips.appendChild(el("span", { class: "chip bad", text: "失败" }));
  else chips.appendChild(el("span", { class: "chip ok", text: "已完成" }));
  chips.appendChild(el("span", { class: "chip", text: ready + " / " + (total || plan.target_count) + " 个可用" }));
  if (p.failed) chips.appendChild(el("span", { class: "chip bad", text: p.failed + " 个失败" }));
  box.appendChild(chips);

  if (total) {
    box.appendChild(el("div", { class: "bar", style: "margin-top:9px" }, [
      el("i", { style: "width:" + Math.round((ready / Math.max(total, 1)) * 100) + "%" }),
    ]));
  }
  if (plan.status === "failed" && plan.error) {
    box.appendChild(el("div", { class: "err", style: "margin-top:10px", text: plan.error }));
  }
  return box;
}

async function openPlan(id) {
  try {
    state.openPlan = await api("/api/plans/" + id);
    render();
  } catch (err) {
    alert(err.message);
  }
}

function renderPlanDetail(main, plan) {
  main.appendChild(el("div", { class: "row", style: "margin-bottom:12px" }, [
    btn("返回计划列表", { class: "btn ghost sm", onClick: () => { state.openPlan = null; render(); } }, "left"),
  ]));

  const card = el("div", { class: "card" });
  card.appendChild(el("h2", { style: "margin-top:0", text: goalText(plan) }));
  const p = plan.progress || {};
  card.appendChild(el("p", { class: "lead", text:
    (plan.language || "en") + " · 目标储备 " + plan.target_count + " 个 · 已建 "
    + (p.total || 0) + " 个（可用 " + (p.ready || 0) + "）" }));
  if (plan.goal_detail) card.appendChild(el("div", { class: "hint", text: plan.goal_detail }));
  if (plan.domains && plan.domains.length) {
    const chips = el("div", { class: "chips", style: "margin-top:10px" });
    for (const d of plan.domains) chips.appendChild(el("span", { class: "chip", text: d }));
    card.appendChild(chips);
  }
  main.appendChild(card);

  const outline = plan.outline || [];
  main.appendChild(el("h2", { text: "大纲（" + outline.length + " 条）" }));
  if (!outline.length) {
    main.appendChild(el("div", { class: "card tight" }, [
      el("div", { class: "faint", text: "还没有大纲。点下面的「重新排大纲」。备" }),
    ]));
  }

  const picked = new Set(outline.map((o) => o.target));
  const holder = el("div", { id: "outline-holder" });
  const countLine = el("div", { class: "faint" });

  const renderItems = () => {
    clear(holder);
    for (const item of outline) {
      const on = picked.has(item.target);
      const row = el("div", { class: "outline-item" + (on ? "" : " off") });
      row.appendChild(el("button", {
        class: "pick", "aria-pressed": String(on),
        title: on ? "点一下排除这条" : "点一下加回来",
        onClick: () => {
          if (picked.has(item.target)) picked.delete(item.target);
          else picked.add(item.target);
          renderItems();
          syncCount();
        },
      }, [icon("check", 12)]));
      const body = el("div", { class: "body" });
      body.appendChild(el("div", { class: "target", text: item.target }));
      if (item.why) body.appendChild(el("div", { class: "why", text: item.why }));
      const tags = el("div", { class: "tags" });
      if (item.kind) tags.appendChild(el("span", { class: "chip", text: item.kind }));
      if (item.domain) tags.appendChild(el("span", { class: "chip accent", text: item.domain }));
      if (item.band) tags.appendChild(el("span", { class: "chip", text: item.band }));
      body.appendChild(tags);
      row.appendChild(body);
      holder.appendChild(row);
    }
  };
  const syncCount = () => {
    countLine.textContent = "将生成 " + picked.size + " 个训练包。"
      + (picked.size === outline.length ? "" : "（排除了 " + (outline.length - picked.size) + " 条）");
  };
  renderItems();
  syncCount();
  main.appendChild(holder);
  main.appendChild(el("div", { style: "margin-top:10px" }, [countLine]));

  const actions = el("div", { class: "row", style: "margin-top:14px" });
  if (plan.status === "generating") {
    actions.appendChild(el("div", { class: "hint", style: "margin:0" }, [
      el("i", { class: "spin" }), " 正在生成…进度在下面。这一步会跑几分钟，可以先切到「训练」去练已有的卡。",
    ]));
  } else {
    actions.appendChild(btn("开始生成这 " + picked.size + " 个", {
      class: "btn primary", id: "plan-start",
      onClick: () => startPlan(plan.id, Array.from(picked)),
    }, "spark"));
  }
  main.appendChild(actions);
  main.appendChild(el("div", { id: "plan-detail-msg" }));

  const jobHost = el("div", { id: "plan-job", style: "margin-top:12px" });
  main.appendChild(jobHost);
  if (plan.status === "generating") {
    refreshPlanJob(plan.id);
    pollPlan(plan.id);
  } else if (plan.status === "failed" && plan.error) {
    jobHost.appendChild(el("div", { class: "err", text: plan.error }));
  }

  const lessons = plan.lessons || [];
  if (!lessons.length) return;

  // 已经生成出来的训练包。顺序按大纲来 —— 倒着显示会把「最后才该学的」
  // 摆到最上面，而用户正是照着这个顺序在往前推的。
  // 直接复用 lessonRow：多写一套只会让两处的行为慢慢长歪。
  main.appendChild(el("h2", { text: "已生成的训练包（" + lessons.length + "）" }));
  for (const lesson of lessons) main.appendChild(lessonRow(lesson));
}

async function refreshPlanJob(planId) {
  const host = $("#plan-job");
  if (!host) return;
  try {
    const data = await api("/api/plans/" + planId + "/job");
    clear(host);
    const job = data.job || {};
    const p = data.progress || {};
    const total = p.total || 0;
    const done = (p.ready || 0) + (p.failed || 0);
    host.appendChild(el("div", { class: "card tight" }, [
      el("div", { class: "row" }, [
        el("i", { class: "spin" }),
        el("div", { class: "grow", text: job.step || "正在生成…" }),
      ]),
      el("div", { class: "bar", style: "margin-top:10px" }, [
        el("i", { style: "width:" + Math.round((done / Math.max(total, 1)) * 100) + "%" }),
      ]),
      el("div", { class: "faint", style: "margin-top:7px",
        text: "已建 " + total + " 个包 · 完成 " + done
            + (p.failed ? " · 失败 " + p.failed : "") }),
    ]));
  } catch (err) { /* 轮询失败就安静停掉 */ }
}

const planTimers = new Map();

function pollPlan(planId) {
  const existing = planTimers.get(planId);
  if (existing) clearTimeout(existing);
  planTimers.set(planId, setTimeout(() => tickPlan(planId), 2500));
}

async function tickPlan(planId) {
  planTimers.delete(planId);
  try {
    const data = await api("/api/plans/" + planId + "/job");
    if (state.view === "plans" && state.openPlan && state.openPlan.id === planId) {
      refreshPlanJob(planId);
    }
    if (data.status === "generating") {
      pollPlan(planId);
      return;
    }
    if (state.view === "plans" && state.openPlan && state.openPlan.id === planId) {
      state.openPlan = await api("/api/plans/" + planId);
      render();
    } else if (state.view === "plans") {
      loadPlans();
    }
    refreshCounts();
  } catch (err) { /* 同上 */ }
}

async function startPlan(planId, targets) {
  const msg = $("#plan-detail-msg");
  if (msg) clear(msg);
  try {
    if (targets && targets.length) {
      const plan = state.openPlan || {};
      const kept = (plan.outline || []).filter((o) => targets.indexOf(o.target) >= 0);
      await api("/api/plans/" + planId + "/outline", {
        method: "PUT", body: JSON.stringify({ outline: kept }),
      });
    }
    await api("/api/plans/" + planId + "/start", { method: "POST" });
    setBanner("ok", "开始生成。可以切到「训练」练已有的卡，这个在后台跑。");
    state.openPlan = await api("/api/plans/" + planId);
    render();
    pollPlan(planId);
  } catch (err) {
    if (msg) msg.appendChild(errorBlock(err));
  }
}

async function removePlan(id, label) {
  if (!confirm("删除计划「" + label + "」？\n\n它下面已生成的训练包和复习记录会一起删掉。")) return;
  try {
    await api("/api/plans/" + id, { method: "DELETE" });
    if (state.openPlan && state.openPlan.id === id) state.openPlan = null;
    render();
  } catch (err) {
    alert(err.message);
  }
}

  const card = cardShell(
    "界面",
    "配色和字号都影响眼睛累不累。三套配色都能用，选一个看着舒服的就行 —— "
    + "没有「正确」的那套。"
  );

  card.appendChild(el("div", { class: "optgrid" }, THEMES.map((t) => {

      class: "optcard", "aria-pressed": String(state.theme === t.id),

      // 「卡片文字里有没有『深色』」去找 —— 而「跟随系统」那张卡的说明里

    el("span", { text: s.what }),
  ]))));

      + "中文说法、语音和配图 —— 那里不需要切到进阶也会出现。"
      + "密度这一档只影响训练页和设置页显示多少数字。"
    ),

}

// 每个配色选项下面摆几块代表色。文字描述（「暖白」）谁都能写，
// 但只有色块能让人一眼看出自己会不会喜欢。
function screenSwatches(themeId) {
  const palettes = {
    auto: ["#ebe6dc", "#33302a", "#3a6f61"],
    warm: ["#ebe6dc", "#33302a", "#3a6f61"],
    light: ["#f5f6f8", "#1d2129", "#2f5f8f"],
    dark: ["#191a1c", "#ddd9d2", "#69b8a2"],
  };
  return (palettes[themeId] || palettes.warm).map((color) =>
    el("i", { style: "background:" + color }));
}

function cardShell(title, subtitle) {
  const card = el("div", { class: "card" });
  card.appendChild(el("h2", { style: "margin-top:0", text: title }));
  if (subtitle) {
    card.appendChild(el("p", { class: "faint", style: "margin:-6px 0 14px", text: subtitle }));
  }

async function onPresetChange(e) {
  const name = e.target.value;
  try {
    const data = await api("/api/config/preset", { method: "POST", body: JSON.stringify({ preset: name }) });
    state.config = data.config;
    const hint = $("#preset-hint");
    const presets = (state.catalog && state.catalog.llm_presets) || {};
    if (hint) hint.textContent = (presets[name] || {}).hint || "";
    const base = $("#llm-base"), model = $("#llm-model");
    if (base) base.value = (data.config.llm || {}).base_url || "";
    if (model) model.value = (data.config.llm || {}).model || "";
  } catch (err) {
    alert(err.message);
  }
}

function onImagePresetChange(e) {
  const name = e.target.value;
  const presets = (state.catalog && state.catalog.image_presets) || {};
  const picked = presets[name] || {};
  const hint = $("#img-preset-hint");
  if (hint) hint.textContent = picked.hint || "";
  const base = $("#img-base"), model = $("#img-model");
  if (base && picked.base_url) base.value = picked.base_url;
  if (model && picked.model) model.value = picked.model;
}

function toggleTTSFields() {
  const engine = ($("#tts-engine") || {}).value || "edge";

function toggleImageFields() {
  const source = ($("#img-source") || {}).value || "search";

}

// 试听：拿任意一个已有音频来播。没有就静默跳过 ——
// 试听只是锦上添花，不该因为「库里没音频」而报错。
async function findLatestAudio() {
  try {
    const data = await api("/api/lessons");
    for (const lesson of data.lessons || []) {
      if (lesson.example_count > 0) {
        const detail = await api("/api/lessons/" + lesson.id);
        for (const ex of detail.examples || []) {
          if (ex.audio_path) return ex.audio_path;
        }
      }
    }
  } catch (err) { /* 忽略 */ }
  return null;
}

async function runSelfCheck() {
  const host = $("#selfcheck");
  if (!host) return;
  clear(host);
  host.appendChild(el("div", { class: "row" }, [
    el("i", { class: "spin" }), el("span", { class: "faint", text: "检查中…" }),
  ]));
  let report;
  try {
    report = await api("/api/selfcheck");
  } catch (err) {
    // 用户可能已经切到别的页面了，这时 #selfcheck 已经是另一个节点。
    const same = $("#selfcheck");
    if (same !== host) return;
    clear(host);
    host.appendChild(errorBlock(err));
    return;
  }
  if ($("#selfcheck") !== host) return;
  clear(host);

  const LEVEL = { ok: "正常", warn: "注意", bad: "有问题" };
  const table = el("table", { class: "self" });
  for (const item of report.items || []) {
    const level = LEVEL[item.level] ? item.level : "bad";
    const right = el("td");
    right.appendChild(el("span", { class: "chip " + level, text: LEVEL[level] }));
    right.appendChild(el("div", { style: "margin-top:4px", text: item.detail }));
    if (item.hint) {
      right.appendChild(el("div", { class: "faint", style: "margin-top:4px", text: "→ " + item.hint }));
    }
    table.appendChild(el("tr", null, [el("td", { text: item.name }), right]));
  }
  host.appendChild(table);
}

const DATA_SOURCE_LABEL = {
  default: "平台默认位置",
  bootstrap: "你在设置里指过的位置",
  ETUDE_DATA_DIR: "环境变量 ETUDE_DATA_DIR 钉住的",
};

async function loadDataLocation() {
  const host = $("#data-location");
  if (!host) return;
  clear(host);
  host.appendChild(spin("正在读取数据目录…"));

  let info;
  try {
    info = await api("/api/data-location");
  } catch (err) {
    if ($("#data-location") !== host) return;
    clear(host);
    host.appendChild(errorBlock(err));
    return;
  }
  if ($("#data-location") !== host) return;
  clear(host);

  const kv = el("dl", { class: "kv" });
  for (const pair of [
    ["当前目录", info.current],
    ["来源", DATA_SOURCE_LABEL[info.source] || info.source],
    ["占用", humanSize(info.bytes) + "（" + info.files + " 个文件）"],
    ["所在盘剩余", humanSize(info.free_bytes)],
    ["平台默认位置", info.default],
  ]) {
    kv.appendChild(el("dt", { text: pair[0] }));
    kv.appendChild(el("dd", { text: pair[1] }));
  }
  host.appendChild(kv);

  const chips = el("div", { class: "chips", style: "margin-top:12px" });
  chips.appendChild(el("span", {
    class: "chip " + (info.moved ? "accent" : "ok"),
    text: info.moved ? "已搬到别的位置" : "在默认位置",
  }));
  if (info.locked_by_env) chips.appendChild(el("span", { class: "chip warn", text: "被环境变量锁住" }));
  host.appendChild(chips);

  if (info.locked_by_env) {
    host.appendChild(el("div", {
      class: "hint", style: "margin-top:10px",
      text: "环境变量 ETUDE_DATA_DIR 的优先级高于这里的设置，所以下面的按钮按了也不会生效。"
          + "先去系统里删掉那个环境变量（或直接把它改成你想要的位置），再重启程序。",
    }));
  }

  if (info.moved) {
    host.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [
      btn("改回平台默认位置", {
        class: "btn sm ghost",
        onClick: () => saveData(false, ""),
      }, "left"),
    ]));
  }
}

// 「把数据搬过去」/「只改位置、不搬数据」/「改回默认位置」都走这里。
// 三个入口共用同一个函数，是因为它们的差别只有 copy 和目标路径两件事，
// 拆成三个函数只会让「搬迁的四条约束」被写三遍、然后慢慢长歪。
let dataBusy = false;

async function saveData(copy, pathOverride) {
  const msg = $("#data-msg");
  if (!msg || dataBusy) return;
  clear(msg);

  const raw = typeof pathOverride === "string" ? pathOverride : readValue("data-path");
  const goingDefault = !raw;
  // 第一个参数既可能是「只改位置」按钮传进来的 false，也可能是
  // onClick 顺手塞进来的事件对象。用 === false 明确判一次，
  // 而不是靠真值判断 —— 否则事件对象会被当成 true。
  const doCopy = copy !== false;

  const question = goingDefault
    ? "改回平台默认位置？\n\n只会改指针，当前目录里的数据不会删。\n重启程序后才生效。"
    : (doCopy
      ? "把整个数据目录复制到：\n" + raw + "\n\n旧位置的数据不会删。\n重启程序后才生效。继续？"
      : "把数据目录指向：\n" + raw + "\n\n不会复制任何数据，新位置从空数据开始。\n"
        + "老数据仍在原地，随时可以改回来。\n重启程序后才生效。继续？");
  if (!confirm(question)) return;

  dataBusy = true;
  msg.appendChild(spin(goingDefault
    ? "正在改回默认位置…"
    : (doCopy ? "正在搬…有音频和图片的话要等一会儿。" : "正在改指针…")));
  try {
    const data = await api("/api/data-location", {
      method: "POST",
      body: JSON.stringify({ path: goingDefault ? "" : raw, copy: doCopy }),
    });
    clear(msg);
    const box = el("div", { class: "hint ok" });
    box.appendChild(el("div", { text: goingDefault ? "指针已经改回默认位置。" : "指针已经指向新位置。" }));
    box.appendChild(el("div", { class: "mono", style: "margin-top:5px", text: data.moved_to || "" }));
    if (data.copied) {
      box.appendChild(el("div", {
        class: "faint", style: "margin-top:5px",
        text: "搬过去 " + data.copied + " 项。旧位置（" + data.left_behind + "）还留着 —— "
            + "等新的能正常用了再自己去删。",
      }));
    }
    if (data.restart_required) {
      box.appendChild(el("div", {
        style: "margin-top:6px", text: "现在要重启程序才会生效。",
      }));
    }
    msg.appendChild(box);
    const input = $("#data-path");
    if (input) input.value = "";
    loadDataLocation();
  } catch (err) {
    clear(msg);
    msg.appendChild(errorBlock(err));
  } finally {
    dataBusy = false;
  }
}

// 备份只做数据库。音频和图片是内容寻址的（名字就是内容的哈希），
// 真丢了也能按原来的名字重新生成，跟着复制一遍是白占地方。
let backupBusy = false;

async function doBackup() {
  const msg = $("#data-msg");
  if (!msg || backupBusy) return;
  backupBusy = true;
  clear(msg);
  msg.appendChild(spin("正在备份数据库…"));
  try {
    const data = await api("/api/backup", { method: "POST", body: JSON.stringify({}) });
    clear(msg);
    const box = el("div", { class: "hint ok" });
    box.appendChild(el("div", { text: "备份好了（" + humanSize(data.bytes) + "）：" }));
    box.appendChild(el("div", { class: "mono", style: "margin-top:5px", text: data.path }));
    msg.appendChild(box);
  } catch (err) {
    clear(msg);
    msg.appendChild(errorBlock(err));
  } finally {
    backupBusy = false;
  }
}

// --------------------------------------------------------- 卡片浏览器

// 「Anki 的灵活度」这件事，一半在编辑（下面那个抽屉），另一半在这里。
//
// 一个只能看到「下一张该练什么」的界面，是没法整理的：学习到一定量之后，
// 人真正想做的是「这一批我都熟了，一起推两周」「这五张先别出现」
// 「把这个包里所有造句卡重置」—— 这些动作都需要**先看见一批卡**。
// 所以这一页是列表 + 筛选 + 多选，而不是又一个漂亮的空状态。

const STATE_LABEL = {
  all: "全部", due: "今天到期", new: "没学过的", learning: "学过但没到期",
  suspended: "已暂停",
};

async function renderCards(main) {
  main.appendChild(el("h1", { text: "卡片" }));
  main.appendChild(el("p", {
    class: "lead",
    text: "每个训练包会为每条例句生成五张卡（阅读/听力/口语/打字/造句）。"
        + "这里可以筛选、暂停、改到期时间 —— 也可以点「编辑」改这条例句本身。",
  }));

  // 筛选器的训练包下拉需要一份清单。没取到就先取，取不到也不挡住列表 ——
  // 只是少一个下拉框，比整页空着强。
  if (!state.lessonList) {
    try {
      const data = await api("/api/lessons");
      state.lessonList = data.lessons || [];
    } catch (err) {
      state.lessonList = [];
    }
  }

  const filt = el("div", { class: "filters" });

  const lessonSel = el("select", null, [el("option", { value: "0", text: "全部训练包" })]);
  for (const lesson of state.lessonList || []) {
    const opt = el("option", { value: String(lesson.id), text: "#" + lesson.id + " " + lesson.target });
    if (Number(state.browser.lesson_id) === lesson.id) opt.selected = true;
    lessonSel.appendChild(opt);
  }
  lessonSel.addEventListener("change", () => {
    state.browser.lesson_id = Number(lessonSel.value) || 0;
    state.browser.picked = [];
    loadBrowser();
  });
  filt.appendChild(el("label", null, [el("span", { text: "训练包" }), lessonSel]));

  const chanSel = el("select", null, [el("option", { value: "", text: "全部通道" })]);
  for (const c of (state.catalog && state.catalog.channels) || []) {
    const opt = el("option", { value: c.id, text: c.label });
    if (state.browser.channel === c.id) opt.selected = true;
    chanSel.appendChild(opt);
  }
  chanSel.addEventListener("change", () => {
    state.browser.channel = chanSel.value;
    state.browser.picked = [];
    loadBrowser();
  });
  filt.appendChild(el("label", null, [el("span", { text: "通道" }), chanSel]));

  const stateSel = el("select");
  for (const key of Object.keys(STATE_LABEL)) {
    const opt = el("option", { value: key, text: STATE_LABEL[key] });
    if (state.browser.state === key) opt.selected = true;
    stateSel.appendChild(opt);
  }
  stateSel.addEventListener("change", () => {
    state.browser.state = stateSel.value;
    state.browser.picked = [];
    loadBrowser();
  });
  filt.appendChild(el("label", null, [el("span", { text: "状态" }), stateSel]));

  const search = el("input", {
    type: "text", value: state.browser.q || "", placeholder: "搜例句或目标词…",
  });
  let searchTimer = null;
  search.addEventListener("input", () => {
    state.browser.q = search.value;
    // 输入框上做 300ms 防抖：每敲一个字发一次请求会让列表一直闪。
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(loadBrowser, 300);
  });
  filt.appendChild(el("label", { class: "grow" }, [el("span", { text: "搜索" }), search]));
  filt.appendChild(btn("刷新", { class: "btn sm", onClick: loadBrowser }, "refresh"));
  main.appendChild(filt);

  main.appendChild(el("div", { id: "browser-host" }));
  loadBrowser();
}

async function loadBrowser() {
  const host = $("#browser-host");
  if (!host) return;
  clear(host);
  host.appendChild(spin("正在读卡片…"));

  const q = new URLSearchParams();
  if (state.browser.lesson_id) q.set("lesson_id", String(state.browser.lesson_id));
  if (state.browser.channel) q.set("channel", state.browser.channel);
  q.set("state", state.browser.state || "all");
  if (state.browser.q) q.set("q", state.browser.q);
  q.set("limit", "300");

  try {
    const data = await api("/api/cards?" + q.toString());
    state.browser.list = data.cards || [];
    state.browser.total = data.total || 0;
    drawBrowser(host);
  } catch (err) {
    clear(host);
    host.appendChild(errorBlock(err));
  }
}

function drawBrowser(host) {
  clear(host);
  const list = state.browser.list || [];
  const picked = state.browser.picked || [];

  if (!list.length) {
    host.appendChild(el("div", { class: "card" }, [
      el("div", { class: "empty" }, [
        el("b", { text: "这个筛选下没有卡片" }),
        el("div", { class: "faint", text: "换一个训练包或状态试试。" }),
      ]),
    ]));
    return;
  }

  if (picked.length) {
    host.appendChild(el("div", { class: "bulkbar" }, [
      el("b", { text: "选中 " + picked.length + " 张" }),
      btn("暂停", { class: "btn sm", onClick: () => bulkPatch({ suspended: true }) }),
      btn("恢复", { class: "btn sm", onClick: () => bulkPatch({ suspended: false }) }),
      btn("推后 1 天", { class: "btn sm", onClick: () => bulkPush(1) }),
      btn("推后 7 天", { class: "btn sm", onClick: () => bulkPush(7) }),
      btn("当作没学过", { class: "btn sm", onClick: () => bulkPatch({ introduced: false }) }),
      btn("取消选择", {
        class: "btn sm ghost",
        onClick: () => { state.browser.picked = []; drawBrowser(host); },
      }),
    ]));
  }

  const table = el("table", { class: "browser" });
  const thead = el("thead");
  const headRow = el("tr");
  const allPicked = list.every((c) => picked.indexOf(c.id) >= 0);
  const master = el("input", { type: "checkbox" });
  if (allPicked) master.checked = true;
  master.addEventListener("change", () => {
    state.browser.picked = master.checked ? list.map((c) => c.id) : [];
    drawBrowser(host);
  });
  headRow.appendChild(el("th", null, [master]));
  for (const label of ["通道", "目标 / 例句", "到期", "间隔", "次数", ""]) {
    headRow.appendChild(el("th", { text: label }));
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el("tbody");
  for (const card of list) {
    const tr = el("tr", { class: (card.suspended ? "off " : "") + (picked.indexOf(card.id) >= 0 ? "picked" : "") });
    // 行上留 id 和暂停状态：批量操作、以及冒烟测试都要能一眼认出是哪张卡。
    tr.dataset.id = String(card.id);
    tr.dataset.suspended = card.suspended ? "1" : "0";

    const box = el("input", { type: "checkbox" });
    if (picked.indexOf(card.id) >= 0) box.checked = true;
    box.addEventListener("change", () => {
      const set = new Set(state.browser.picked);
      if (box.checked) set.add(card.id); else set.delete(card.id);
      state.browser.picked = Array.from(set);
      drawBrowser(host);
    });
    tr.appendChild(el("td", null, [box]));

    const chan = ((state.catalog && state.catalog.channels) || [])
      .filter((c) => c.id === card.channel)[0];
    tr.appendChild(el("td", null, [el("span", {
      class: "mini", text: (chan && chan.label) || card.channel,
    })]));

    tr.appendChild(el("td", { class: "sent" }, [
      el("div", { text: card.target || "（整包）" }),
      el("div", { class: "faint", text: card.sentence || "" }),
    ]));

    tr.appendChild(el("td", { class: "num", text: dueText(card) }));
    tr.appendChild(el("td", { class: "num", text: card.interval ? fmtInterval(card.interval) : "新卡" }));
    tr.appendChild(el("td", { class: "num", text: card.reps + " 次" }));

    const acts = el("div", { class: "rowacts" });
    acts.appendChild(el("button", {
      text: card.suspended ? "恢复" : "暂停",
      onClick: () => patchOne(card.id, { suspended: !card.suspended }),
    }));
    acts.appendChild(el("button", {
      text: "编辑",
      onClick: () => openEditorForCard(card),
    }));
    acts.appendChild(el("button", {
      text: "打开",
      title: "去这个训练包",
      onClick: () => { setView("lessons"); openLesson(card.lesson_id); },
    }));
    tr.appendChild(el("td", null, [acts]));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);

  host.appendChild(el("div", { class: "faint", style: "margin-bottom:8px" }, [
    document.createTextNode("显示 " + list.length + " / 共 " + (state.browser.total || list.length) + " 张"),
  ]));
  host.appendChild(table);

  host.appendChild(el("div", { class: "hint" }, [
    document.createTextNode("想直接改某一条例句的内容（原文、场景、中文说法、语音、配图），点那一行的「编辑」。"),
  ]));
}

function dueText(card) {
  if (!card.introduced) return "新卡";
  const due = new Date(card.due_at);
  if (isNaN(due.getTime())) return "—";
  const diff = due.getTime() - Date.now();
  if (diff <= 0) return "现在";
  const mins = diff / 60000;
  if (mins < 60) return Math.round(mins) + " 分";
  const hours = mins / 60;
  if (hours < 24) return Math.round(hours) + " 时";
  return Math.round(hours / 24) + " 天";
}

function fmtInterval(days) {
  if (days < 1) return Math.round(days * 24) + " 时";
  if (days < 30) return (Math.round(days * 10) / 10) + " 天";
  return (Math.round(days / 30 * 10) / 10) + " 月";
}

async function patchOne(cardId, patch) {
  try {
    await api("/api/cards/" + cardId, { method: "PATCH", body: JSON.stringify(patch) });
    loadBrowser();
    refreshCounts();
  } catch (err) {
    setBanner("bad", err.message);
  }
}

async function bulkPatch(patch) {
  const ids = state.browser.picked || [];
  if (!ids.length) return;
  try {
    const r = await api("/api/cards/batch", {
      method: "POST", body: JSON.stringify({ ids: ids, patch: patch }),
    });
    setBanner("ok", "改了 " + r.changed + " 张卡。");
    state.browser.picked = [];
    loadBrowser();
    refreshCounts();
  } catch (err) {
    setBanner("bad", err.message);
  }
}

async function bulkPush(days) {
  const ids = state.browser.picked || [];
  if (!ids.length) return;
  try {
    const r = await api("/api/cards/push", {
      method: "POST", body: JSON.stringify({ ids: ids, days: days }),
    });
    setBanner("ok", "把 " + r.changed + " 张卡往后推了 " + days + " 天。");
    state.browser.picked = [];
    loadBrowser();
    refreshCounts();
  } catch (err) {
    setBanner("bad", err.message);
  }
}

// ------------------------------------------------------- 卡片编辑器抽屉

// 这是「老手调控」的落点，但**新手也不会被它挡住** ——
// 抽屉要主动点「编辑这条」或按 E 才出来，平时不占任何地方。
//
// 里面的分组顺序是按「改动的可能性」排的：
//   1. 文字（原文 / 场景 / 中文说法）—— 最常改，模型偶尔会写歪
//   2. 语音与配图 —— 次常改，某一条合成失败时来补
//   3. 复习参数 —— 老手才动，且用「简易」密度时默认折起来
//
// 保存走 PATCH，**只提交改过的字段**。整份提交的话，两个窗口同时开着
// 就会互相覆盖 —— 这类问题在单机工具里也会出现（比如训练页和浏览器页同时开着）。

async function openEditorForCard(card) {
  try {
    const data = await api("/api/cards/" + card.id);
    openEditor(data);
  } catch (err) {
    setBanner("bad", "打不开这条：" + err.message);
  }
}

// 从训练包详情页的某条例句打开（那里没有卡片上下文，就用第一张卡）。
async function openEditorForExample(lessonId, exampleId) {
  try {
    const lesson = await api("/api/lessons/" + lessonId);
    const card = (lesson.cards || []).filter((c) => c.example_id === exampleId)[0];
    if (card) {
      const data = await api("/api/cards/" + card.id);
      openEditor(data);
      return;
    }
    // 没有卡就先补一张：编辑例句时「编辑完却练不到」是最坏的结果。
    await api("/api/lessons/" + lessonId + "/rebuild-cards", { method: "POST" });
    const again = await api("/api/lessons/" + lessonId);
    const fresh = (again.cards || []).filter((c) => c.example_id === exampleId)[0];
    if (fresh) openEditor(await api("/api/cards/" + fresh.id));
    else setBanner("warn", "这条例句没有对应的卡片，先补一次卡再编辑。");
  } catch (err) {
    setBanner("bad", "打不开这条：" + err.message);
  }
}

function openEditor(data) {
  if (!data || !data.example) {
    setBanner("warn", "这张卡没有对应的例句（整包级的卡暂时不能从这里编辑）。");
    return;
  }
  const ex = data.example;
  state.editing = {
    cardId: data.card.id,
    lessonId: data.card.lesson_id,
    exampleId: ex.id,
    channel: data.card.channel,
    draft: {
      sentence: ex.sentence || "",
      scene_en: ex.scene_en || "",
      scene_zh: ex.scene_zh || "",
      register: ex.register || "",
      variants: (ex.zh_variants || []).slice(),
      scene_image: ex.scene_image || "",
    },
    card: data.card,
    audio_path: ex.audio_path || "",
    msg: "",
    busy: false,
  };
  drawEditor();
}

function closeEditor() {
  state.editing = null;
  const host = $("#drawer-host");
  if (host) clear(host);
  render();
}

function drawEditor() {
  let host = $("#drawer-host");
  if (!host) {
    host = el("div", { id: "drawer-host" });
    document.body.appendChild(host);
  }
  clear(host);
  const ed = state.editing;
  if (!ed) return;

  const card = ed.card;
  const chan = ((state.catalog && state.catalog.channels) || [])
    .filter((c) => c.id === ed.channel)[0];

  const drawer = el("div", { class: "drawer" });

  // ---- 头部 ----
  const head = el("div", { class: "drawer-head" });
  head.appendChild(el("div", { class: "grow" }, [
    el("h2", { text: "编辑例句" }),
    el("div", {
      class: "sub",
      text: "这张卡来自：" + (chan && chan.label) + " · 卡片 #" + card.id
          + " · 这条例句的五个通道会一起改",
    }),
  ]));
  head.appendChild(btn("关闭", { class: "btn sm ghost", onClick: closeEditor }));
  drawer.appendChild(head);

  // ---- 文字 ----
  const textBox = el("div", { class: "subcard" });
  textBox.appendChild(el("h3", { text: "文字" }));
  textBox.appendChild(el("label", { class: "field" }, [
    el("span", { class: "lab", text: "例句原文（英文）" }),
    el("textarea", {
      id: "ed-sentence",
      onInput: (e) => { ed.draft.sentence = e.target.value; },
    }, [document.createTextNode(ed.draft.sentence)]),
  ]));
  textBox.appendChild(el("label", { class: "field" }, [
    el("span", {
      class: "lab",
      text: "场景（英文）—— 写「什么情况下会说这句话」，不是翻译",
    }),
    el("textarea", {
      id: "ed-scene-en",
      onInput: (e) => { ed.draft.scene_en = e.target.value; },
    }, [document.createTextNode(ed.draft.scene_en)]),
  ]));
  textBox.appendChild(el("label", { class: "field" }, [
    el("span", {
      class: "lab",
      text: "中文说法（多个，每次随机抽一个 —— 中文和英文之间不要形成一一对应）",
    }),
    variantsEditor(ed),
  ]));
  textBox.appendChild(el("label", { class: "field", style: "margin-bottom:0" }, [
    el("span", { class: "lab", text: "语域（如：日常口语 / 正式书面）" }),
    el("input", {
      type: "text", value: ed.draft.register,
      onInput: (e) => { ed.draft.register = e.target.value; },
    }),
  ]));
  drawer.appendChild(textBox);

  // ---- 语音与配图 ----
  const mediaBox = el("div", { class: "subcard" });
  mediaBox.appendChild(el("h3", { text: "语音与配图" }));
  mediaBox.appendChild(el("div", { class: "media-row" }, [
    el("div", { class: "grow" }, [
      el("div", { class: "faint", text: ed.audio_path ? "已有语音：" + ed.audio_path : "还没有语音" }),
      el("div", { class: "row", style: "margin-top:8px" }, [
        ed.audio_path
          ? btn("试听", { class: "btn sm", onClick: () => playAudio(ed.audio_path) }, "play")
          : null,
        btn("重新生成语音", {
          class: "btn sm",
          onClick: () => regenAudio(ed),
        }, "refresh"),
        !ed.audio_path ? btn("用系统语音读一遍", {
          class: "btn sm ghost",
          onClick: () => speakText(ed.draft.sentence),
        }) : null,
      ]),
      el("div", {
        class: "faint", style: "margin-top:7px",
        text: "改过原文之后一定要重新生成语音 —— 否则听到的和看到的是两句不同的话。",
      }),
    ]),
  ]));

  const imgWrap = el("div", { class: "media-row", style: "margin-top:12px" });
  if (ed.draft.scene_image) {
    imgWrap.appendChild(el("img", {
      src: imageSrc(ed.draft.scene_image), alt: "场景配图",
      referrerpolicy: "no-referrer",
    }));
  } else {
    imgWrap.appendChild(el("div", {
      class: "imgfail", style: "max-width:120px;height:84px",
      text: "没有配图",
    }));
  }
  const imgActs = el("div", { class: "grow" }, [
    el("div", { class: "faint", text: "配图跟着「场景（英文）」走" }),
    el("div", { class: "row", style: "margin-top:8px" }, [
      el("input", {
        type: "text", id: "ed-img", placeholder: "或粘贴一个图片地址…",
        style: "max-width:230px",
      }),
      btn("用这个地址", { class: "btn sm", onClick: () => useImageUrl(ed) }),
      btn("重新生成", { class: "btn sm", onClick: () => regenImage(ed) }, "image"),
    ]),
    el("div", {
      class: "faint", style: "margin-top:7px",
      text: "默认是「检索 + 画图 并行」。配到不合适的图时，这里可以换一张，"
          + "或者贴一个自己找的地址。",
    }),
  ]);
  imgWrap.appendChild(imgActs);
  mediaBox.appendChild(imgWrap);
  drawer.appendChild(mediaBox);

  // ---- 复习参数 ----
  drawer.appendChild(srsEditor(ed));

  // ---- 底部 ----
  const foot = el("div", { class: "drawer-foot" });
  foot.appendChild(btn(ed.busy ? "保存中…" : "保存", {
    class: "btn primary", onClick: () => saveEditor(ed),
  }, "check"));
  foot.appendChild(btn("删除这条例句", {
    class: "btn danger", onClick: () => deleteEditingExample(ed),
  }, "trash"));
  foot.appendChild(el("span", { class: "faint", text: "Esc 关闭" }));
  drawer.appendChild(foot);

  if (ed.msg) {
    drawer.appendChild(typeof ed.msg === "string"
      ? el("div", { class: "hint", text: ed.msg })
      : ed.msg);
  }

  host.appendChild(el("div", {
    class: "drawer-wrap",
    onClick: (e) => { if (e.target === e.currentTarget) closeEditor(); },
  }, [drawer]));
}

// 中文说法是多条。用「一行一条」而不是 JSON ——
// 让用户手写带引号的数组是在给自己找麻烦。
function variantsEditor(ed) {
  const box = el("div", { class: "varlist" });
  const rows = el("div", { class: "varlist" });
  const redraw = () => {
    clear(rows);
    ed.draft.variants.forEach((value, i) => {
      const row = el("div", { class: "varrow" });
      row.appendChild(el("input", {
        type: "text", value: value,
        onInput: (e) => { ed.draft.variants[i] = e.target.value; },
      }));
      row.appendChild(el("button", {
        class: "iconbtn", title: "删掉这条说法",
        onClick: () => { ed.draft.variants.splice(i, 1); redraw(); },
      }, [icon("trash", 14)]));
      rows.appendChild(row);
    });
    if (!ed.draft.variants.length) {
      rows.appendChild(el("div", { class: "faint", text: "一条都没有。至少给一条 —— 场景是这张卡的正面。" }));
    }
  };
  redraw();
  box.appendChild(rows);
  box.appendChild(el("div", { class: "row", style: "margin-top:7px" }, [
    btn("加一条说法", {
      class: "btn sm",
      onClick: () => { ed.draft.variants.push(""); redraw(); },
    }, "plus"),
  ]));
  return box;
}

function srsEditor(ed) {
  const card = ed.card;
  const box = el("div", { class: "subcard" });
  box.appendChild(el("h3", { text: "复习参数（老手用）" }));

  if (!isAdvanced()) {
    box.appendChild(el("div", {
      class: "faint",
      text: "当前是「简易」界面，这里只显示摘要。想直接改数字，"
          + "去「设置 → 界面」把界面密度切到「进阶」。",
    }));
    box.appendChild(el("div", { class: "faint", style: "margin-top:8px" }, [
      document.createTextNode(
        "到期 " + dueText(card) + " · 间隔 " + (card.interval ? fmtInterval(card.interval) : "新卡")
        + " · 难度 " + card.ease + " · 练过 " + card.reps + " 次"
      ),
    ]));
    return box;
  }

  box.appendChild(el("div", { class: "grid2" }, [
    el("label", { class: "field" }, [
      el("span", { class: "lab", text: "间隔（天）—— 改它会把到期时间一起算出来" }),
      el("input", {
        type: "number", id: "ed-interval", step: "0.5", min: "0",
        value: card.interval || 0,
        onChange: (e) => patchCardNow(ed, { interval: Number(e.target.value) }),
      }),
    ]),
    el("label", { class: "field" }, [
      el("span", { class: "lab", text: "难度系数（1.3 – 3.5，越大间隔涨得越快）" }),
      el("input", {
        type: "number", id: "ed-ease", step: "0.05", min: "1.3", max: "3.5",
        value: card.ease || 2.5,
        onChange: (e) => patchCardNow(ed, { ease: Number(e.target.value) }),
      }),
    ]),
  ]));
  box.appendChild(el("div", { class: "row" }, [
    btn("推后 1 天", { class: "btn sm", onClick: () => patchCardNow(ed, { push: 1 }) }),
    btn("推后 7 天", { class: "btn sm", onClick: () => patchCardNow(ed, { push: 7 }) }),
    btn(card.suspended ? "恢复这张卡" : "暂停这张卡", {
      class: "btn sm", onClick: () => patchCardNow(ed, { suspended: !card.suspended }),
    }),
    btn("当作没学过", { class: "btn sm ghost", onClick: () => patchCardNow(ed, { introduced: false }) }),
  ]));
  box.appendChild(el("div", { class: "faint", style: "margin-top:9px" }, [
    document.createTextNode(
      "卡片 #" + card.id + " · 到期 " + card.due_at + " · 练过 " + card.reps
      + " 次 · 忘过 " + card.lapses + " 次"
    ),
  ]));
  return box;
}

async function patchCardNow(ed, patch) {
  try {
    let result;
    if ("push" in patch) {
      result = await api("/api/cards/push", {
        method: "POST", body: JSON.stringify({ ids: [ed.cardId], days: patch.push }),
      });
    } else {
      result = await api("/api/cards/" + ed.cardId, {
        method: "PATCH", body: JSON.stringify(patch),
      });
    }
    const fresh = await api("/api/cards/" + ed.cardId);
    ed.card = fresh.card;
    ed.msg = result && result.changed ? "推后了 " + patch.push + " 天。" : "改了。";
    drawEditor();
    refreshCounts();
  } catch (err) {
    ed.msg = errorBlock(err);
    drawEditor();
  }
}

async function saveEditor(ed) {
  if (ed.busy) return;
  ed.busy = true;
  try {
    const d = ed.draft;
    await api("/api/examples/" + ed.exampleId, {
      method: "PATCH",
      body: JSON.stringify({
        sentence: d.sentence.trim(),
        scene_en: d.scene_en,
        scene_zh: d.scene_zh,
        register: d.register,
        zh_variants: d.variants.map((v) => v.trim()).filter(Boolean),
      }),
    });
    setBanner("ok", "改好了。如果改了原文，记得点一次「重新生成语音」。");
    await refreshAfterEdit(ed);
    ed.busy = false;
    drawEditor();
  } catch (err) {
    ed.busy = false;
    ed.msg = errorBlock(err);
    drawEditor();
  }
}

async function regenAudio(ed) {
  ed.msg = "正在合成语音…";
  drawEditor();
  try {
    const r = await api("/api/examples/" + ed.exampleId + "/audio", { method: "POST" });
    ed.audio_path = r.audio_path;
    ed.msg = "语音好了（" + r.audio_path + "）。";
    playAudio(r.audio_path);
  } catch (err) {
    ed.msg = errorBlock(err);
  }
  drawEditor();
  refreshAfterEdit(ed);
}

async function regenImage(ed) {
  ed.msg = "正在配图…（「检索 + 画图 并行」，可能要十几秒）";
  drawEditor();
  try {
    const r = await api("/api/examples/" + ed.exampleId + "/image", { method: "POST" });
    ed.draft.scene_image = r.scene_image;
    ed.msg = "配好了：" + r.scene_image;
  } catch (err) {
    ed.msg = errorBlock(err);
  }
  drawEditor();
  refreshAfterEdit(ed);
}

// 手动贴一个图片地址。
//
// 这是配图那条链路上最后的兜底：图库搜不到、模型画不好、或者用户
// 心里正好有一张合适的图 —— 三种情况都该有个地方把地址填进去。
// 只接受 http(s)，且**不下载**：存 URL 而不是存文件，用户换图零成本。
async function useImageUrl(ed) {
  const node = $("#ed-img");
  const url = node ? node.value.trim() : "";
  if (!url) {
    ed.msg = "先在上面填一个图片地址。";
    drawEditor();
    return;
  }
  if (!/^https?:\/\//i.test(url)) {
    ed.msg = "只接受 http:// 或 https:// 开头的地址。";
    drawEditor();
    return;
  }
  ed.draft.scene_image = url;
  try {
    await api("/api/examples/" + ed.exampleId, {
      method: "PATCH", body: JSON.stringify({ scene_image: url }),
    });
    ed.msg = "用上这个地址了。";
  } catch (err) {
    ed.msg = errorBlock(err);
  }
  drawEditor();
  refreshAfterEdit(ed);
}

async function deleteEditingExample(ed) {
  const ok = window.confirm(
    "删掉这条例句和它的五张卡？\n\n复习进度会一起没有，而且不能撤销。"
    + "如果只是想暂时不看到它，请用「暂停这张卡」。"
  );
  if (!ok) return;
  try {
    const r = await api("/api/examples/" + ed.exampleId, { method: "DELETE" });
    closeEditor();
    setBanner("ok", "删掉了这条例句和它的 " + r.deleted_cards + " 张卡。");
    loadQueue();
  } catch (err) {
    ed.msg = errorBlock(err);
    drawEditor();
  }
}

// 编辑完之后，把当前页面的数据重新拉一遍。
// 不重新拉的话，界面上还是改之前的内容 —— 用户会以为没保存成功。
async function refreshAfterEdit(ed) {
  try {
    if (state.view === "study" && state.current && state.current.card.id === ed.cardId) {
      const fresh = await api("/api/cards/" + ed.cardId);
      state.current = fresh;
      render();
    } else if (state.view === "cards") {
      loadBrowser();
    } else if (state.view === "lessons" && state.openLesson) {
      await openLesson(state.openLesson);
    }
  } catch (err) { /* 刷新失败不该盖住刚才那句成功提示 */ }
  refreshCounts();
}

// ------------------------------------------------------------------ 键盘
// 快捷键要么和侧边栏里写的一致，要么就别写在那儿。
// 这里的每一档都走和鼠标**同一个函数**，所以不可能再出现
// 「键盘能按、鼠标不能按」这种不一致。
function handleKeys(e) {
  // 抽屉开着的时候，键盘归抽屉管（Esc 关闭，其余交给输入框）。
  if (state.editing) {
    if (e.key === "Escape") { e.preventDefault(); closeEditor(); }
    return;
  }
  if (state.view !== "study") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // 上/下一张和撤销不依赖「当前有没有卡」，所以放在前面。
  if (e.key === "ArrowLeft") { e.preventDefault(); prevCard(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); nextCard(); return; }
  if (e.key === "z" || e.key === "Z") { e.preventDefault(); undoLastGrade(); return; }
  if ((e.key === "e" || e.key === "E") && state.current) {
    e.preventDefault();
    openEditor(state.current);
    return;
  }

  if (!state.current || state.cursor >= state.queue.length) return;
  const channel = state.current.card ? state.current.card.channel : "";

  // 打字卡：Enter 先提交比对。已经在输入框里按 Enter 的那条由输入框自己处理。
  if (e.key === "Enter" && channel === "type" && !state.revealed) {
    e.preventDefault();
    submitTyped();
    return;
  }
  if (e.key === " " || e.key === "Enter") {
    if (!state.revealed) { e.preventDefault(); reveal(); }
    return;
  }
  if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4") {
    e.preventDefault();
    grade(Number(e.key) - 1);
  }
}

document.addEventListener("keydown", handleKeys);

// ------------------------------------------------------------ 错误上屏

// 这是个零构建的项目：任何一处抛异常，「症状」都会是一个安静的、半截的界面。
// 所以把没接住的错误直接摆到页面上 —— 用户能把它复制给你，
// 而不是只能描述「点了没反应」。
function showFatal(what, detail) {
  const banner = document.getElementById("banner");
  if (!banner) return;
  banner.className = "bad";
  clear(banner);
  banner.appendChild(document.createTextNode(what + "：" + detail));
  banner.appendChild(document.createElement("br"));
  banner.appendChild(document.createTextNode(
    "把这一行连同截图发给作者。按 F12 打开控制台能看到完整的调用栈。"
  ));
}

window.addEventListener("error", (e) => {
  showFatal("界面出了一个错", (e && e.message) || String(e));
});

window.addEventListener("unhandledrejection", (e) => {
  const reason = e && e.reason;
  showFatal("有一个操作没做完", (reason && reason.message) ? reason.message : String(reason));
});

// -------------------------------------------------------------- 渲染

function render() {
  const main = $("#app");
  if (!main) return;
  clear(main);

  if (state.view === "study") renderStudy(main);
  else if (state.view === "cards") renderCards(main);
  else if (state.view === "lessons") renderLessons(main);
  else if (state.view === "plans") renderPlans(main);
  else renderSettings(main);

  // 侧边栏的交互键跟着视图走。它不在 #app 里，所以要单独画一次。
  renderSideActions();
  refreshCounts();
  paintIcons();

  // 抽屉挂在 body 上，不在 #app 里，所以重绘 #app 不会带上它。
  // 后果不只是「慢一拍」：**改外观的那个开关就在抽屉里**，
  // 用户在抽屉里点「进阶」，画面纹丝不动 —— 典型的点了没反应。
  // drawEditor() 本身先 clear 再画，重复调用是安全的。
  if (state.editing) drawEditor();
}

// -------------------------------------------------------------- 启动

// ------------------------------------------------------- 外观（主题/字号）

// 三套主题 + 跟随系统。**「跟随系统」不是一个第四套配色**，
// 它只是把「用哪套」的决定权交给操作系统 —— 所以 data-theme 直接
// 不设为 dark/light/warm，让 CSS 里那条 prefers-color-scheme 生效。
//
// 这个区分很重要：0.0.2 只有「跟随系统」和「手动深/浅」两种状态，
// 结果是「我白天想要暖白、晚上跟着系统变深色」这种需求表达不出来。
const THEMES = [
  { id: "auto", label: "跟随系统", what: "白天暖白，系统切到深色时跟着变" },
  { id: "warm", label: "暖白 · 护眼", what: "米黄底、暖灰字，长时间看不累（默认）" },
  { id: "light", label: "冷白 · 清晰", what: "纯白底，对比更利落，适合白天光线足时" },
  { id: "dark", label: "深色 · 夜间", what: "暖调深灰，不是纯黑，夜里不刺眼" },
];

const SIZES = [
  { id: "s", label: "小", what: "一屏看更多" },
  { id: "m", label: "标准", what: "默认" },
  { id: "l", label: "大", what: "字号和行距一起放大" },
];

function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  return THEMES.filter((t) => t.id === set)[0] ? set : "auto";
}

// 现在实际显示的是深色还是浅色（用于选图标）。「自动」要问系统。
function effectiveDark() {
  const theme = currentTheme();
  if (theme === "auto") return matchMedia("(prefers-color-scheme: dark)").matches;
  return theme === "dark";
}

function applyLook() {
  const root = document.documentElement;
  // 自动时不写属性 —— 写了反而会盖掉 CSS 里的媒体查询。
  if (state.theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
  root.setAttribute("data-size", state.fontSize || "m");

  const node = $("#theme");
  if (node) {
    clear(node);
    node.appendChild(icon(effectiveDark() ? "sun" : "moon", 16));
    node.title = "换一个配色（当前：" + (
      (THEMES.filter((t) => t.id === state.theme)[0] || THEMES[0]).label
    ) + "）";
  }
}

// 侧边栏那个按钮在四套之间轮转。要改具体某套去「设置 → 界面」——
// 一个图标按钮最多只能表达「下一个」。
function cycleTheme() {
  const order = THEMES.map((t) => t.id);
  const at = order.indexOf(state.theme);
  setLook({ theme: order[(at + 1) % order.length] });
}

function setLook(patch) {
  if (patch.theme) state.theme = patch.theme;
  if (patch.fontSize) state.fontSize = patch.fontSize;
  if (patch.density) state.density = patch.density;
  try {
    localStorage.setItem("etude-theme", state.theme);
    localStorage.setItem("etude-size", state.fontSize);
    localStorage.setItem("etude-density", state.density);
  } catch (e) { /* 隐私模式写不了，忽略 */ }
  applyLook();
  render();
}

async function boot() {
  // 外观三件套：主题、字号、界面密度。都存在本地，重开还是这套。
  //
  // 兼容 0.0.2 留下的老值（那边只存 "dark" / "light" 两个值，
  // 而且**没有** "auto"）。老值直接就是新表里的 id，所以不用转换；
  // 只是那时候「没存过」等于跟随系统，这里同理 —— 缺省就用 auto。
  try {
    const savedTheme = localStorage.getItem("etude-theme");
    if (savedTheme && THEMES.some((t) => t.id === savedTheme)) state.theme = savedTheme;
    const savedSize = localStorage.getItem("etude-size");
    if (SIZES.some((s) => s.id === savedSize)) state.fontSize = savedSize;
    const savedDensity = localStorage.getItem("etude-density");
    if (savedDensity === "advanced" || savedDensity === "simple") state.density = savedDensity;
    state.sideCollapsed = localStorage.getItem("etude-side") === "collapsed";
  } catch (e) { /* 隐私模式 */ }

  applyLook();
  applySide();
  paintIcons();

  const themeBtn = $("#theme");
  if (themeBtn) themeBtn.addEventListener("click", cycleTheme);

  // 系统主题变了、而用户选的是「跟随系统」时，图标要跟着换。
  try {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.theme === "auto") applyLook();
    });
  } catch (e) { /* 老浏览器没有 addEventListener 版本，忽略 */ }

  const collapse = $("#collapse");
  if (collapse) collapse.addEventListener("click", toggleSide);

  for (const button of document.querySelectorAll("#nav button")) {
    button.addEventListener("click", () => setView(button.dataset.view));
  }

  // 浏览器前进/后退也要跟着切页面 —— 不然地址栏和内容会对不上。
  window.addEventListener("hashchange", () => {
    const next = viewFromHash();
    if (next !== state.view) setView(next);
  });

  try {
    const health = await api("/api/health");
    state.health = health;
    const badge = $("#health");
    clear(badge);
    badge.textContent = "v" + health.version + " · " + health.mode;
    badge.className = "badge ok";
    // 前端常量 vs 后端版本。不一致时明确弹出来 ——
    // 这种不一致几乎总是「端口上有个旧进程」，而不是文案问题。
    if (health.version !== APP_VERSION) {
      setBanner("bad",
        "版本不一致：界面是 " + APP_VERSION + "，后端是 " + health.version +
        "（pid " + health.pid + "，数据目录 " + health.data_dir + "）。" +
        "多半是端口上还留着一个旧进程，关掉它再重开程序。");
    }
  } catch (err) {
    const badge = $("#health");
    if (badge) {
      clear(badge);
      badge.textContent = "连不上后端";
      badge.className = "badge bad";
    }
    setBanner("bad", "连不上后端服务：" + err.message);
  }

  // 这两个失败了不要紧：设置页/目标页各自会再报一次，
  // 在启动阶段弹红条反而会盖住真正的版本不一致提示。
  try { state.config = await api("/api/config"); } catch (err) { /* 设置页会再报 */ }
  try { state.catalog = await api("/api/catalog"); } catch (err) { /* 同上 */ }

  setView(viewFromHash());
  loadQueue();
}

boot();
</script>
