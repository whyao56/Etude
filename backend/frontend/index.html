// 试听：拿任意一个已有音频来播。没有就静默跳过 ——
// 试听只是锦上添花，不该因为「库里没音频」而报错。
async function findLatestAudio() {
  try {
    const data = await api("/api/lessons");
    for (const lesson of data.lessons || []) {
      if (lesson.example_count > 0) {
        const detail = await api("/api/lessons/" + lesson.id);
        for (const ex of detail.examples || []) {
          if (ex.audio_path) return ex.audio_path;
        }
      }
    }
  } catch (err) { /* 忽略 */ }
  return null;
}

async function runSelfCheck() {
  const host = $("#selfcheck");
  if (!host) return;
  clear(host);
  host.appendChild(el("div", { class: "row" }, [
    el("i", { class: "spin" }), el("span", { class: "faint", text: "检查中…" }),
  ]));
  let report;
  try {
    report = await api("/api/selfcheck");
  } catch (err) {
    // 用户可能已经切到别的页面了，这时 #selfcheck 已经是另一个节点。
    const same = $("#selfcheck");
    if (same !== host) return;
    clear(host);
    host.appendChild(errorBlock(err));
    return;
  }
  if ($("#selfcheck") !== host) return;
  clear(host);

  const LEVEL = { ok: "正常", warn: "注意", bad: "有问题" };
  const table = el("table", { class: "self" });
  for (const item of report.items || []) {
    const level = LEVEL[item.level] ? item.level : "bad";
    const right = el("td");
    right.appendChild(el("span", { class: "chip " + level, text: LEVEL[level] }));
    right.appendChild(el("div", { style: "margin-top:4px", text: item.detail }));
    if (item.hint) {
      right.appendChild(el("div", { class: "faint", style: "margin-top:4px", text: "→ " + item.hint }));
    }
    table.appendChild(el("tr", null, [el("td", { text: item.name }), right]));
  }
  host.appendChild(table);
}

// ------------------------------------------------------------------ 数据

const DATA_SOURCE_LABEL = {
  default: "平台默认位置",
  bootstrap: "你在设置里指过的位置",
  ETUDE_DATA_DIR: "环境变量 ETUDE_DATA_DIR 钉住的",
};

async function loadDataLocation() {
  const host = $("#data-location");
  if (!host) return;
  clear(host);
  host.appendChild(spin("正在读取数据目录…"));

  let info;
  try {
    info = await api("/api/data-location");
  } catch (err) {
    if ($("#data-location") !== host) return;
    clear(host);
    host.appendChild(errorBlock(err));
    return;
  }
  if ($("#data-location") !== host) return;
  clear(host);

  const kv = el("dl", { class: "kv" });
  for (const pair of [
    ["当前目录", info.current],
    ["来源", DATA_SOURCE_LABEL[info.source] || info.source],
    ["占用", humanSize(info.bytes) + "（" + info.files + " 个文件）"],
    ["所在盘剩余", humanSize(info.free_bytes)],
    ["平台默认位置", info.default],
  ]) {
    kv.appendChild(el("dt", { text: pair[0] }));
    kv.appendChild(el("dd", { text: pair[1] }));
  }
  host.appendChild(kv);

  const chips = el("div", { class: "chips", style: "margin-top:12px" });
  chips.appendChild(el("span", {
    class: "chip " + (info.moved ? "accent" : "ok"),
    text: info.moved ? "已搬到别的位置" : "在默认位置",
  }));
  if (info.locked_by_env) chips.appendChild(el("span", { class: "chip warn", text: "被环境变量锁住" }));
  host.appendChild(chips);

  if (info.locked_by_env) {
    host.appendChild(el("div", {
      class: "hint", style: "margin-top:10px",
      text: "环境变量 ETUDE_DATA_DIR 的优先级高于这里的设置，所以下面的按钮按了也不会生效。"
          + "先去系统里删掉那个环境变量（或直接把它改成你想要的位置），再重启程序。",
    }));
  }

  if (info.moved) {
    host.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [
      btn("改回平台默认位置", {
        class: "btn sm ghost",
        onClick: () => saveData(false, ""),
      }, "left"),
    ]));
  }
}

// 「把数据搬过去」/「只改位置、不搬数据」/「改回默认位置」都走这里。
// 三个入口共用同一个函数，是因为它们的差别只有 copy 和目标路径两件事，
// 拆成三个函数只会让「搬迁的四条约束」被写三遍、然后慢慢长歪。
let dataBusy = false;

async function saveData(copy, pathOverride) {
  const msg = $("#data-msg");
  if (!msg || dataBusy) return;
  clear(msg);

  const raw = typeof pathOverride === "string" ? pathOverride : readValue("data-path");
  const goingDefault = !raw;
  // 第一个参数既可能是「只改位置」按钮传进来的 false，也可能是
  // onClick 顺手塞进来的事件对象。用 === false 明确判一次，
  // 而不是靠真值判断 —— 否则事件对象会被当成 true。
  const doCopy = copy !== false;

  const question = goingDefault
    ? "改回平台默认位置？\n\n只会改指针，当前目录里的数据不会删。\n重启程序后才生效。"
    : (doCopy
      ? "把整个数据目录复制到：\n" + raw + "\n\n旧位置的数据不会删。\n重启程序后才生效。继续？"
      : "把数据目录指向：\n" + raw + "\n\n不会复制任何数据，新位置从空数据开始。\n"
        + "老数据仍在原地，随时可以改回来。\n重启程序后才生效。继续？");
  if (!confirm(question)) return;

  dataBusy = true;
  msg.appendChild(spin(goingDefault
    ? "正在改回默认位置…"
    : (doCopy ? "正在搬…有音频和图片的话要等一会儿。" : "正在改指针…")));
  try {
    const data = await api("/api/data-location", {
      method: "POST",
      body: JSON.stringify({ path: goingDefault ? "" : raw, copy: doCopy }),
    });
    clear(msg);
    const box = el("div", { class: "hint ok" });
    box.appendChild(el("div", { text: goingDefault ? "指针已经改回默认位置。" : "指针已经指向新位置。" }));
    box.appendChild(el("div", { class: "mono", style: "margin-top:5px", text: data.moved_to || "" }));
    if (data.copied) {
      box.appendChild(el("div", {
        class: "faint", style: "margin-top:5px",
        text: "搬过去 " + data.copied + " 项。旧位置（" + data.left_behind + "）还留着 —— "
            + "等新的能正常用了再自己去删。",
      }));
    }
    if (data.restart_required) {
      box.appendChild(el("div", {
        style: "margin-top:6px", text: "现在要重启程序才会生效。",
      }));
    }
    msg.appendChild(box);
    const input = $("#data-path");
    if (input) input.value = "";
    loadDataLocation();
  } catch (err) {
    clear(msg);
    msg.appendChild(errorBlock(err));
  } finally {
    dataBusy = false;
  }
}

// 备份只做数据库。音频和图片是内容寻址的（名字就是内容的哈希），
// 真丢了也能按原来的名字重新生成，跟着复制一遍是白占地方。
let backupBusy = false;

async function doBackup() {
  const msg = $("#data-msg");
  if (!msg || backupBusy) return;
  backupBusy = true;
  clear(msg);
  msg.appendChild(spin("正在备份数据库…"));
  try {
    const data = await api("/api/backup", { method: "POST", body: JSON.stringify({}) });
    clear(msg);
    const box = el("div", { class: "hint ok" });
    box.appendChild(el("div", { text: "备份好了（" + humanSize(data.bytes) + "）：" }));
    box.appendChild(el("div", { class: "mono", style: "margin-top:5px", text: data.path }));
    msg.appendChild(box);
  } catch (err) {
    clear(msg);
    msg.appendChild(errorBlock(err));
  } finally {
    backupBusy = false;
  }
}

// ------------------------------------------------------------------ 键盘

// 快捷键要么和侧边栏里写的一致，要么就别写在那儿。
// 这里的每一档都走 grade() —— 跟鼠标点是**同一个函数**，
// 所以不可能再出现「键盘能按、鼠标不能按」这种不一致。
function handleKeys(e) {
  if (state.view !== "study") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!state.current || state.cursor >= state.queue.length) return;

  const channel = state.current.card ? state.current.card.channel : "";

  // 打字卡：Enter 先提交比对。已经在输入框里按 Enter 的那条由输入框自己处理。
  if (e.key === "Enter" && channel === "type" && !state.revealed) {
    e.preventDefault();
    submitTyped();
    return;
  }
  if (e.key === " " || e.key === "Enter") {
    if (!state.revealed) { e.preventDefault(); reveal(); }
    return;
  }
  if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4") {
    e.preventDefault();
    grade(Number(e.key) - 1);
  }
}

document.addEventListener("keydown", handleKeys);

// ------------------------------------------------------------ 错误上屏

// 这是个零构建的项目：任何一处抛异常，「症状」都会是一个安静的、半截的界面。
// 所以把没接住的错误直接摆到页面上 —— 用户能把它复制给你，
// 而不是只能描述「点了没反应」。
function showFatal(what, detail) {
  const banner = document.getElementById("banner");
  if (!banner) return;
  banner.className = "bad";
  clear(banner);
  banner.appendChild(document.createTextNode(what + "：" + detail));
  banner.appendChild(document.createElement("br"));
  banner.appendChild(document.createTextNode(
    "把这一行连同截图发给作者。按 F12 打开控制台能看到完整的调用栈。"
  ));
}

window.addEventListener("error", (e) => {
  showFatal("界面出了一个错", (e && e.message) || String(e));
});

window.addEventListener("unhandledrejection", (e) => {
  const reason = e && e.reason;
  showFatal("有一个操作没做完", (reason && reason.message) ? reason.message : String(reason));
});

// -------------------------------------------------------------- 渲染

function render() {
  const main = $("#app");
  if (!main) return;
  clear(main);

  if (state.view === "study") renderStudy(main);
  else if (state.view === "lessons") renderLessons(main);
  else if (state.view === "plans") renderPlans(main);
  else renderSettings(main);

  // 侧边栏的交互键跟着视图走。它不在 #app 里，所以要单独画一次。
  renderSideActions();
  refreshCounts();
  paintIcons();
}

// -------------------------------------------------------------- 启动

function paintTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  const dark = set ? set === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const node = $("#theme");
  if (!node) return;
  clear(node);
  node.appendChild(icon(dark ? "sun" : "moon", 16));
  node.title = dark ? "切到浅色" : "切到深色";
}

async function boot() {
  // 主题：跟随系统，用户手动选过就听用户的。
  let saved = null;
  try { saved = localStorage.getItem("etude-theme"); } catch (e) { /* 隐私模式 */ }
  if (saved) document.documentElement.setAttribute("data-theme", saved);

  let side = null;
  try { side = localStorage.getItem("etude-side"); } catch (e) { /* 同上 */ }
  state.sideCollapsed = side === "collapsed";

  paintTheme();
  applySide();
  paintIcons();

  const themeBtn = $("#theme");
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const set = document.documentElement.getAttribute("data-theme");
      const dark = set ? set === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      const next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("etude-theme", next); } catch (e) { /* 忽略 */ }
      paintTheme();
    });
  }

  const collapse = $("#collapse");
  if (collapse) collapse.addEventListener("click", toggleSide);

  for (const button of document.querySelectorAll("#nav button")) {
    button.addEventListener("click", () => setView(button.dataset.view));
  }

  // 浏览器前进/后退也要跟着切页面 —— 不然地址栏和内容会对不上。
  window.addEventListener("hashchange", () => {
    const next = viewFromHash();
    if (next !== state.view) setView(next);
  });

  try {
    const health = await api("/api/health");
    state.health = health;
    const badge = $("#health");
    clear(badge);
    badge.textContent = "v" + health.version + " · " + health.mode;
    badge.className = "badge ok";
    // 前端常量 vs 后端版本。不一致时明确弹出来 ——
    // 这种不一致几乎总是「端口上有个旧进程」，而不是文案问题。
    if (health.version !== APP_VERSION) {
      setBanner("bad",
        "版本不一致：界面是 " + APP_VERSION + "，后端是 " + health.version +
        "（pid " + health.pid + "，数据目录 " + health.data_dir + "）。" +
        "多半是端口上还留着一个旧进程，关掉它再重开程序。");
    }
  } catch (err) {
    const badge = $("#health");
    if (badge) {
      clear(badge);
      badge.textContent = "连不上后端";
      badge.className = "badge bad";
    }
    setBanner("bad", "连不上后端服务：" + err.message);
  }

  // 这两个失败了不要紧：设置页/目标页各自会再报一次，
  // 在启动阶段弹红条反而会盖住真正的版本不一致提示。
  try { state.config = await api("/api/config"); } catch (err) { /* 设置页会再报 */ }
  try { state.catalog = await api("/api/catalog"); } catch (err) { /* 同上 */ }

  setView(viewFromHash());
  loadQueue();
}

boot();
</script>
