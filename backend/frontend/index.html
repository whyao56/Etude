<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Etude · 句子五通道语言训练器</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <link rel="stylesheet" href="/static/css/views.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" id="side">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">É</span>
          <span class="brand-text">
            <b>Etude</b>
            <span>句子五通道训练器</span>
          </span>
        </div>

        <nav class="nav" id="nav" aria-label="主导航"></nav>

        <div class="side-spacer"></div>

        <div class="side-block" id="side-block"></div>

        <div class="side-foot">
          <div class="foot-row">
            <span class="dot" id="health-dot"></span>
            <button class="side-version" id="about-btn" type="button" title="关于 / 诊断">
              <span id="health-text">正在连接…</span>
            </button>
          </div>
          <div class="foot-tools">
            <button class="iconbtn" id="help-btn" type="button" data-icon="help" title="快捷键（?）" aria-label="快捷键"></button>
            <button class="iconbtn" id="theme-btn" type="button" data-icon="sun" title="切换配色" aria-label="切换配色"></button>
            <button class="iconbtn" id="side-btn" type="button" data-icon="panel" title="收起侧栏" aria-label="收起侧栏"></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <h1 id="page-title">训练</h1>
          <span class="sub" id="page-sub"></span>
          <span class="grow"></span>
          <div class="row" id="page-actions"></div>
        </header>

        <div class="banner" id="banner" role="status" aria-live="polite"></div>

        <main class="content" id="app">正在加载…</main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="overlay-host"></div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
